name: Refresh GitHub activity

# The recent-activity panel (commit feed, contribution grid, repo count) is
# baked into the bundle at BUILD time by scripts/build-github-activity.mjs.
# Vercel only builds on a push to main, so without this the panel freezes at
# whenever main was last touched — two quiet weeks means two-week-old commits.
#
# This pings a Vercel Deploy Hook on a schedule. Vercel then rebuilds from main
# with GH_CONTRIB_TOKEN set, so the bake picks up fresh commits AND the
# contribution calendar (which needs the token and so can never be refreshed
# from the browser). Nothing is committed — the generated file in git is only
# the local/offline fallback, and the deploy regenerates it either way.
#
# Setup (one-off):
#   1. Vercel → Project → Settings → Git → Deploy Hooks → create one on `main`
#      (name it e.g. "refresh-github-activity"). Copy the URL.
#   2. GitHub → repo Settings → Secrets and variables → Actions → New secret,
#      named VERCEL_DEPLOY_HOOK_URL, pasting that URL.
# The URL is a bearer credential — anyone holding it can trigger a deploy — so
# it lives in a secret, never in this file.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC (off the hour: scheduled runs queue)
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-github-activity
  cancel-in-progress: true

jobs:
  refresh:
    name: Trigger a Vercel rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Vercel deploy hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK_URL}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is not set — see the setup notes in this workflow."
            exit 1
          fi
          # --fail-with-body so a 4xx/5xx surfaces Vercel's reason, not just a code.
          # The URL itself is never echoed; only the response body is.
          status=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            --request POST \
            --write-out '%{http_code}' \
            --output /tmp/hook-response.json \
            "${HOOK_URL}")
          echo "Deploy hook responded ${status}:"
          cat /tmp/hook-response.json
          echo
